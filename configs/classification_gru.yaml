# model
rnn_type: gru
num_layers: 3
embed_dim: 256
hidden_size: 256
bidirectional: false

# data
tokenizer: word
word_vocab_max: 20000
bpe_vocab_size: 1000
test_size: 0.2
split_seed: 42

# gradient flow probe
probe_t: 120
max_lag: 60

# training
output_dir: data/processed/lecture/lstm_gru_classification/out_word_gru
project: rnn-lecture-classification
run_name: word-gru
report_to: wandb
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
num_train_epochs: 10
learning_rate: 2.0e-4
eval_strategy: epoch
save_strategy: epoch
logging_steps: 50
load_best_model_at_end: true
metric_for_best_model: auc
greater_is_better: true
seed: 42
dataloader_pin_memory: false  # not supported on MPS
